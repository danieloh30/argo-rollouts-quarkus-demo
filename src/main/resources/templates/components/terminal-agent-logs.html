<!-- GitOps Agent Logs Terminal Component -->
<div>
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">GitOps Agent Logs</h2>
            <div class="terminal-cmd">oc logs -f deployment/kubernetes-agent -n openshift-gitops</div>
        </div>
        <div class="terminal" id="terminalAgentLogs">
            <div class="terminal-titlebar">
                <div class="terminal-dots">
                    <span class="terminal-dot red"></span>
                    <span class="terminal-dot yellow"></span>
                    <span class="terminal-dot green"></span>
                </div>
                <span class="terminal-tab">logs — kubernetes-agent</span>
            </div>
            <pre class="terminal-body" id="terminalAgentLogsBody">Connecting to cluster...</pre>
        </div>
    </div>
</div>
