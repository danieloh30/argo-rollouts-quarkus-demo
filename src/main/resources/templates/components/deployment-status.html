<!-- Deployment Status Component -->
<div>
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Deployment Info</h2>
            <div class="deploy-revision" id="deployRevision"></div>
        </div>
        <div class="deploy-grid">
            <div class="deploy-item">
                <div class="deploy-label">Phase</div>
                <div class="deploy-value" id="deploymentStatusValue">--</div>
            </div>
            <div class="deploy-item">
                <div class="deploy-label">Message</div>
                <div class="deploy-value deploy-message" id="rolloutMessage">--</div>
            </div>
            <div class="deploy-item">
                <div class="deploy-label">Image</div>
                <div class="deploy-value deploy-mono" id="deployImage">--</div>
            </div>
            <div class="deploy-item">
                <div class="deploy-label">Strategy</div>
                <div class="deploy-value deploy-mono">Canary (Argo Rollouts)</div>
            </div>
        </div>
    </div>
</div>
