name: Build Scenario Images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  build-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - name: stable
            tag: v1.stable
            null_pointer: "false"
            memory_leak: "false"
          - name: null-pointer-bug
            tag: v2.nullpointer
            null_pointer: "true"
            memory_leak: "false"
          - name: memory-leak
            tag: v3.memoryleak
            null_pointer: "false"
            memory_leak: "true"
          - name: slow-dependency
            tag: v4.slowdependency
            null_pointer: "false"
            memory_leak: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update application.properties for scenario
        run: |
          echo "Configuring scenario: ${{ matrix.scenario.name }}"
          sed -i "s/enable.null.pointer.bug=.*/enable.null.pointer.bug=${{ matrix.scenario.null_pointer }}/" src/main/resources/application.properties
          sed -i "s/enable.memory.leak=.*/enable.memory.leak=${{ matrix.scenario.memory_leak }}/" src/main/resources/application.properties
          sed -i "s/enable.connection.leak=.*/enable.connection.leak=false/" src/main/resources/application.properties
          sed -i "s/enable.cpu.spike=.*/enable.cpu.spike=false/" src/main/resources/application.properties
          sed -i "s/enable.slow.dependency=.*/enable.slow.dependency=false/" src/main/resources/application.properties
          if [ "${{ matrix.scenario.name }}" = "slow-dependency" ]; then
            sed -i "s/enable.slow.dependency=false/enable.slow.dependency=true/" src/main/resources/application.properties
          fi
          sed -i "s/load.generator.enabled=.*/load.generator.enabled=true/" src/main/resources/application.properties

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Build container image
        run: |
          docker build -f src/main/docker/Dockerfile.jvm \
            -t quay.io/danieloh30/argo-rollouts-quarkus-demo:${{ matrix.scenario.tag }} .

      - name: Build Summary
        run: |
          echo "### Scenario: ${{ matrix.scenario.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image built:** \`quay.io/danieloh30/argo-rollouts-quarkus-demo:${{ matrix.scenario.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**NullPointerException Bug:** \`${{ matrix.scenario.null_pointer }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Memory Leak:** \`${{ matrix.scenario.memory_leak }}\`" >> $GITHUB_STEP_SUMMARY
